<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>心‧路 ─ 日式視覺小說</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-tc@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-tc@latest/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-tc@latest/900.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-tc@latest/index.css">
<style>
:root{--gold:#d9b64a;--ink:#0b0e17;--chh:94vh}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:'Noto Serif TC',serif;color:#e8e6df;user-select:none}
#game{position:fixed;inset:0;overflow:hidden;cursor:pointer}
#stage{position:absolute;inset:0}
#bgWrap{position:absolute;inset:0;transition:filter 1.2s ease}
.bgLayer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease;transform:scale(1.02)}
.bgLayer.on{opacity:1}
#bgWrap.t-night{filter:brightness(.8) saturate(.9)}
#bgWrap.t-day{filter:brightness(1.08) saturate(1.02)}
#bgWrap.t-warm{filter:sepia(.22) saturate(1.05) brightness(1.02)}
#bgWrap.t-dusk{filter:sepia(.32) hue-rotate(-12deg) brightness(.94)}
#bgWrap.t-cold{filter:saturate(.72) brightness(.9) hue-rotate(8deg)}
#bgWrap.t-dim{filter:brightness(.55) saturate(.85)}
#cgLayer{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;pointer-events:none}
#cgLayer.on{opacity:1}
#cgLayer img{width:100%;height:100%;object-fit:cover;animation:kenburns 18s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.12) translate(1.5%,-1%)}}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.42) 100%)}
/* ---------- 人物立繪 ---------- */
#charLayer{position:absolute;inset:0;pointer-events:none}
.char{position:absolute;bottom:-2vh;width:var(--chh);height:var(--chh);opacity:0;transform:translateY(26px) scale(.985);
 transition:opacity .5s ease,transform .5s ease,left .65s cubic-bezier(.4,.1,.2,1);will-change:left,opacity}
.char.on{opacity:1;transform:translateY(0) scale(1)}
.char.out{opacity:0;transform:translateY(14px) scale(.99)}
.char.pos-center{left:calc(50% - var(--chh)/2)}
.char.pos-left{left:1%}
.char.pos-right{left:max(1%,calc(99% - var(--chh)))}
.char .sprite{position:relative;width:100%;height:100%}
.char .sprite img,.char .sprite svg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .35s ease;filter:drop-shadow(0 10px 26px rgba(0,0,0,.5))}
/* ---------- fx ---------- */
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flashA .6s ease}
@keyframes flashA{0%{opacity:.95}100%{opacity:0}}
#stage.shake{animation:shakeA .55s ease}
@keyframes shakeA{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-6px,3px)}80%{transform:translate(5px,-3px)}}
#tunnelFx{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;overflow:hidden}
#tunnelFx.go{animation:tunnelA 5.2s ease}
@keyframes tunnelA{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
#tunnelFx .streak{position:absolute;top:0;bottom:0;width:26%;background:linear-gradient(90deg,transparent,rgba(255,240,200,.14),transparent);transform:translateX(-120%)}
#tunnelFx.go .streak{animation:streakA 1.1s linear infinite}
#tunnelFx.go .streak:nth-child(2){animation-delay:.4s;top:20%;bottom:40%}
#tunnelFx.go .streak:nth-child(3){animation-delay:.75s;top:55%;bottom:10%}
@keyframes streakA{from{transform:translateX(-130%)}to{transform:translateX(520%)}}
#newsOv{position:absolute;top:6%;left:50%;transform:translate(-50%,-30px);width:min(760px,92%);opacity:0;pointer-events:none;transition:all .6s ease;z-index:30}
#newsOv.on{opacity:1;transform:translate(-50%,0)}
#newsOv .band{background:linear-gradient(90deg,#b3121b,#7d0e14);color:#fff;font-family:'Noto Sans TC';font-weight:700;letter-spacing:.35em;padding:6px 18px;font-size:13px}
#newsOv .head{background:rgba(20,10,12,.88);border:1px solid rgba(255,90,90,.5);padding:14px 18px;font-size:clamp(14px,2.2vw,20px);font-weight:700;color:#ffd9d9;letter-spacing:.06em}
#newsOv .sub{background:rgba(20,10,12,.7);padding:6px 18px;font-size:12px;color:#d8a8a8;font-family:'Noto Sans TC'}
/* ---------- dialog ---------- */
#dialog{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(1080px,95%);min-height:148px;background:linear-gradient(180deg,rgba(14,17,28,.86),rgba(9,11,20,.92));border:1px solid rgba(217,182,74,.35);border-radius:14px;backdrop-filter:blur(8px);padding:34px 40px 30px;opacity:0;transition:opacity .5s ease;z-index:40;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#dialog.show{opacity:1}
#nameplate{position:absolute;top:-17px;left:24px;padding:5px 22px;background:linear-gradient(180deg,#2a2436,#171320);border:1px solid rgba(217,182,74,.6);border-radius:6px;font-weight:700;font-size:16px;letter-spacing:.14em;color:var(--npc,#ffd9a0);box-shadow:0 4px 14px rgba(0,0,0,.45)}
#nameplate.hide{display:none}
#textbox{font-size:clamp(15px,1.9vw,19px);line-height:2.05;letter-spacing:.05em;min-height:78px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#dialog.cls-think #textbox{font-style:italic;color:#c9d2e6}
#dialog.cls-phone #textbox{font-style:italic;color:#bfe0ff}
#dialog.cls-sms #textbox{color:#b8e6b8}
#dialog.cls-sms #textbox::before{content:"✉ ";color:#7ec98f}
#dialog.cls-news #textbox{color:#ffb4b4;font-weight:700;letter-spacing:.1em}
#nextInd{position:absolute;right:20px;bottom:10px;color:var(--gold);font-size:13px;animation:blink 1s infinite;opacity:0}
#nextInd.on{opacity:1}
@keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}
#chapPill{position:absolute;top:14px;left:16px;z-index:45;padding:5px 16px;background:rgba(10,12,20,.6);border:1px solid rgba(217,182,74,.4);border-radius:999px;font-size:12.5px;letter-spacing:.2em;color:#e6d3a0;opacity:0;transition:opacity .6s;font-family:'Noto Sans TC'}
#chapPill.on{opacity:1}
#controls{position:absolute;top:12px;right:14px;z-index:60;display:none;gap:6px;align-items:center;font-family:'Noto Sans TC'}
#controls.on{display:flex}
#controls button{background:rgba(12,14,24,.66);color:#cfd3e0;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;letter-spacing:.08em;transition:all .2s}
#controls button:hover{color:#fff;border-color:rgba(217,182,74,.6)}
#controls button.act{background:rgba(217,182,74,.25);color:#ffe6ad;border-color:var(--gold)}
#vol{width:74px;accent-color:var(--gold);cursor:pointer}
#chapCard{position:absolute;inset:0;z-index:70;background:radial-gradient(ellipse at center,rgba(20,16,28,.94),rgba(0,0,0,.97));display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer}
#chapCard.on{display:flex;animation:cardIn .8s ease}
@keyframes cardIn{from{opacity:0}to{opacity:1}}
#chapCard .no{font-size:15px;letter-spacing:.6em;color:var(--gold);font-family:'Noto Sans TC'}
#chapCard .ti{font-size:clamp(30px,6vw,58px);font-weight:900;letter-spacing:.3em;text-indent:.3em;color:#f2ead8}
#chapCard .line{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#chapCard .hint{margin-top:26px;font-size:12px;color:#8a8fa0;letter-spacing:.3em;font-family:'Noto Sans TC'}
#choiceLayer{position:absolute;inset:0;z-index:65;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.35)}
#choiceLayer.on{display:flex}
#choiceLayer .q{font-size:14px;letter-spacing:.3em;color:#cbb98a;margin-bottom:8px}
#choiceLayer button{width:min(560px,86%);padding:14px 20px;background:rgba(16,18,30,.85);border:1px solid rgba(217,182,74,.45);color:#eee6d2;font-size:16px;letter-spacing:.1em;border-radius:10px;cursor:pointer;font-family:'Noto Serif TC';transition:all .25s}
#choiceLayer button:hover{background:rgba(217,182,74,.2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
#logModal{position:absolute;inset:0;z-index:80;background:rgba(5,6,12,.94);display:none;flex-direction:column;padding:60px 8vw;backdrop-filter:blur(6px)}
#logModal.on{display:flex}
#logModal h3{color:var(--gold);letter-spacing:.4em;margin-bottom:20px;font-size:15px}
#logBody{overflow-y:auto;flex:1;padding-right:12px}
#logBody .ln{margin-bottom:14px;line-height:1.8;font-size:15px}
#logBody .ln b{color:var(--gold);margin-right:10px;font-size:13px}
#logClose{position:absolute;top:20px;right:26px;background:none;border:1px solid rgba(255,255,255,.3);color:#ccc;border-radius:8px;padding:6px 14px;cursor:pointer}
#titleScreen{position:absolute;inset:0;z-index:90;overflow:hidden}
#titleScreen .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;animation:kenburns 26s ease-in-out infinite alternate}
#titleScreen .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.05) 40%,rgba(5,6,14,.88) 100%)}
#titleScreen .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6vh;gap:10px}
#titleScreen .t1{font-size:clamp(52px,10vw,104px);font-weight:900;letter-spacing:.28em;text-indent:.28em;color:#f6efdd;text-shadow:0 4px 30px rgba(0,0,0,.7),0 0 60px rgba(255,170,80,.25)}
#titleScreen .t2{font-size:clamp(12px,1.8vw,16px);letter-spacing:.42em;color:#d8c9a4;text-shadow:0 2px 10px #000}
#titleScreen .cred{font-size:11px;color:#9aa0b0;letter-spacing:.2em;font-family:'Noto Sans TC'}
#titleBtns{display:flex;flex-direction:column;gap:10px;margin-top:22px;align-items:center}
#titleBtns button{width:230px;padding:11px 0;background:rgba(12,14,24,.72);border:1px solid rgba(217,182,74,.55);color:#f0e6cd;font-size:16px;letter-spacing:.35em;text-indent:.35em;border-radius:10px;cursor:pointer;font-family:'Noto Serif TC';transition:all .25s}
#titleBtns button:hover{background:rgba(217,182,74,.22);transform:translateY(-2px)}
#titleBtns button:disabled{opacity:.35;cursor:default;transform:none}
#titleScreen .note{margin-top:12px;font-size:11px;color:#8d93a6;letter-spacing:.15em;font-family:'Noto Sans TC'}
#loadTip{font-size:11px;color:#6f7688;letter-spacing:.12em;font-family:'Noto Sans TC';min-height:16px}
#chapSelect{position:absolute;inset:0;z-index:95;background:rgba(4,5,10,.96);display:none;flex-direction:column;align-items:center;padding-top:9vh;gap:10px}
#chapSelect.on{display:flex}
#chapSelect h3{letter-spacing:.5em;color:var(--gold);margin-bottom:18px}
#chapSelect button{width:min(480px,86%);padding:11px;background:rgba(16,18,30,.8);border:1px solid rgba(255,255,255,.16);color:#ddd6c4;border-radius:9px;font-size:15px;letter-spacing:.15em;cursor:pointer;font-family:'Noto Serif TC'}
#chapSelect button:hover:not(:disabled){border-color:var(--gold);background:rgba(217,182,74,.15)}
#chapSelect button:disabled{opacity:.3;cursor:default}
#chapSelect .back{width:auto;padding:8px 26px;margin-top:16px;border-color:rgba(217,182,74,.5);color:#e6d3a0}
#endScreen{position:absolute;inset:0;z-index:92;background:#05060c;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
#endScreen.on{display:flex;animation:cardIn 2s ease}
#endScreen .big{font-size:clamp(40px,7vw,72px);font-weight:900;letter-spacing:.4em;text-indent:.4em;color:#f2ead8}
#endScreen .poem{font-size:clamp(13px,1.8vw,17px);line-height:2.3;color:#b9bfcf;letter-spacing:.12em}
#endScreen .fin{color:var(--gold);letter-spacing:.5em;font-size:14px;margin-top:8px}
#endScreen button{margin-top:18px;width:220px;padding:10px;background:rgba(12,14,24,.7);border:1px solid rgba(217,182,74,.5);color:#f0e6cd;letter-spacing:.3em;text-indent:.3em;border-radius:9px;cursor:pointer;font-family:'Noto Serif TC'}
#endScreen button:hover{background:rgba(217,182,74,.2)}
@media (max-width:700px){:root{--chh:72vh}#dialog{padding:28px 22px 24px;min-height:130px}}
</style>
</head>
<body>
<div id="game">
  <div id="stage">
    <div id="bgWrap"><div class="bgLayer" id="bgA"></div><div class="bgLayer" id="bgB"></div></div>
    <div id="cgLayer"></div>
    <div id="charLayer"></div>
    <div id="tunnelFx"><div class="streak"></div><div class="streak"></div><div class="streak"></div></div>
    <div id="vignette"></div>
  </div>
  <div id="flash"></div>
  <div id="newsOv"><div class="band">突發新聞</div><div class="head">臺鐵東線重大出軌事故　傷亡慘重</div><div class="sub">事故地點：花蓮・鳳林段　詳細情況持續更新中</div></div>
  <div id="chapPill"></div>
  <div id="dialog"><div id="nameplate" class="hide"></div><div id="textbox"></div><div id="nextInd">▼</div></div>
  <div id="controls">
    <button id="btnAuto">AUTO</button><button id="btnSkip">SKIP</button><button id="btnLog">LOG</button>
    <button id="btnMusic">♪</button><input id="vol" type="range" min="0" max="100" value="60">
  </div>
  <div id="choiceLayer"></div>
  <div id="chapCard"></div>
  <div id="logModal"><h3>對話紀錄</h3><div id="logBody"></div><button id="logClose">關閉</button></div>
  <div id="titleScreen">
    <div class="bgimg"></div><div class="shade"></div>
    <div class="inner">
      <div class="cred">原作小說改編・視覺小說</div>
      <div class="t1">心‧路</div>
      <div class="t2">一條鐵路，承載傷痕與希望</div>
      <div id="titleBtns">
        <button id="btnStart">開始遊戲</button>
        <button id="btnCont">繼續閱讀</button>
        <button id="btnChap">章節選擇</button>
      </div>
      <div id="loadTip">立繪去背處理中……</div>
      <div class="note">♪ 本作含自動演奏配樂・建議開啟聲音・點擊／空白鍵前進</div>
    </div>
  </div>
  <div id="chapSelect"><h3>章節選擇</h3><div id="chapList"></div><button class="back" id="chapBack">返回</button></div>
  <div id="endScreen">
    <div class="big">心‧路</div>
    <div class="poem">火車進入隧道，從光亮變成黑暗。<br>火車穿過隧道，從黑暗變回光亮。<br>而人與人之間的路，斷了之後，<br>又該在哪一站，重新接上？</div>
    <div class="fin">─ END ─</div>
    <button id="btnAgain">重新開始</button>
    <button id="btnTitle2">回到標題</button>
  </div>
</div>
<script>
/* ================= utils ================= */
let _uid=0; const uid=()=>'q'+(++_uid);
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=(n>>16)&255,g=(n>>8)&255,b=n&255;return `rgb(${r*f|0},${g*f|0},${b*f|0})`;}
const $=id=>document.getElementById(id);
/* ================= images ================= */
const BG={
 title:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/1bf55df9e-038a-4bc9-aa35-b51b84655ec7.png',
 office:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/1c842e1c8-d7c8-46d7-b3b2-d829b9a66ed3.png',
 elevator:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/1367fff9a-9e83-470b-8c86-c1775a691fc8.png',
 bedroom:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/19d599c17-c866-45d3-8fab-60434d22b3df.png',
 town:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/1b01a3380-b04c-4313-98c0-bdb376e52bef.png',
 bus:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/1c8b41778-3113-4a03-9d6a-93bfa32b99a7.png',
 yard:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/18ca71620-a7b6-48ae-9d56-c8694081943b.png',
 room:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/1329c6d98-1748-4da6-b9c2-a6a6737721d7.png',
 train:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/18e4ca264-106b-46a4-994f-9192d7c4e86d.png',
 hosp:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/1c1f528a7-cb6b-41f9-be99-d1d86a4ac9da.png'
};
const CG={hospital:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/178b809a3-d382-4d7e-910e-6a0ba1b0f647.png'};
const CIMG={
 liu_ol_n:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/1bb5be5d0-f4cf-4662-8ef3-9d24aaddab8a.png',
 liu_ol_c:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/1c36b1244-68a2-49b5-8ec0-b21dbaf5059a.png',
 liu_ol_s:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/132f4eb69-653f-4494-ba00-59dafccfbb8d.png',
 liu_u_n:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/1d3d17210-bcb8-4a03-a200-1f377f708190.png',
 liu_u_s:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/153d27e85-153c-44a4-9bb8-0a03ecbf1f4e.png',
 liu_home_n:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/1a6a1f589-87d0-4094-9592-c372ef073277.png',
 liu_home_mask:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/1e3da2978-4eb7-4d52-9742-e878fa7c937f.png',
 liu_trip:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/169a69bb8-1606-470e-b8ad-be2dfadc2bce.png',
 guard:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/1aff2efec-b423-4eb7-9b66-c6ef25008f45.png',
 hua:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/1d600a90b-1d23-4cac-8f91-f77e64b39210.png',
 bro:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/14b9a5c79-b41e-49ab-a2a1-362e0f7a8f03.png',
 mom:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/1c9d3ed14-172b-4c6b-a0e1-4c62ef057b07.png',
 tea:'https://image.qwenlm.ai/public_source/00b25c30-e70e-4ece-af0c-dec5724aa441/11281753b-8e0e-43f4-b9b2-9d0714804dc1.png'
};
Object.values(CIMG).forEach(u=>{const im=new Image();im.src=u;});
function spriteKey(id,expr,outfit){
 if(id==='liu'){
  if(outfit==='uniform')return ['shock','sad','worried','cry','angry','cold'].includes(expr)?'liu_u_s':'liu_u_n';
  if(outfit==='home')return expr==='mask'?'liu_home_mask':'liu_home_n';
  if(outfit==='trip')return 'liu_trip';
  if(['cold','angry','grit'].includes(expr))return 'liu_ol_c';
  if(['sad','worried','cry','shock'].includes(expr))return 'liu_ol_s';
  return 'liu_ol_n';
 }
 if(id==='guard')return 'guard';
 if(id==='hua')return 'hua';
 if(id==='bro')return 'bro';
 if(id==='mom')return 'mom';
 if(id==='tea')return 'tea';
 return 'liu_ol_n';
}
/* ================================================================

   2) 邊界種子 flood-fill：
      ・嚴格：亮度>200、飽和<22、且接近背景參考色（distRef<50）
      ・漸層擴張：亮度>150、飽和<26、與相鄰已去背像素色距<40、
        且仍接近背景參考色（distRef<50）
      → 米白針織衫（飽和≈27）與皮膚（飽和更高）不會被誤判，
        只有真正的中性白／灰背景會被移除。
   3) 邊緣修整：僅移除「純中性、幾乎等於背景色」且緊鄰去背區
      的像素；角色本體一律完全不透明。

const SPRITE_T={};
function makeTransparent(key,url){
 return new Promise(res=>{
  const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{try{
   const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
   const x=c.getContext('2d');x.drawImage(img,0,0);
   const d=x.getImageData(0,0,c.width,c.height),data=d.data,w=c.width,h=c.height,N=w*h;
   const lum=i=>(data[i]*299+data[i+1]*587+data[i+2]*114)/1000;
   const chr=i=>Math.max(data[i],data[i+1],data[i+2])-Math.min(data[i],data[i+1],data[i+2]);
   const dist=(i,j)=>{const a=data[i]-data[j],b=data[i+1]-data[j+1],e=data[i+2]-data[j+2];return Math.sqrt(a*a+b*b+e*e);};
   const refs=[];
   [[1,1],[w-9,1],[1,h-9],[w-9,h-9]].forEach(([cx,cy])=>{let r=0,g=0,b=0,n=0;
     for(let yy=cy;yy<cy+8&&yy<h;yy++)for(let xx=cx;xx<cx+8&&xx<w;xx++){const i=(yy*w+xx)*4;r+=data[i];g+=data[i+1];b+=data[i+2];n++;}
     refs.push([r/n,g/n,b/n]);});
   const distRef=i=>{let m=1e9;for(const rc of refs){const a=data[i]-rc[0],b=data[i+1]-rc[1],e=data[i+2]-rc[2];const dd=a*a+b*b+e*e;if(dd<m)m=dd;}return Math.sqrt(m);};
   const bg=new Uint8Array(N),stack=[];
   const isStrict=i=>lum(i)>200&&chr(i)<22&&distRef(i)<50;
   const seed=p=>{if(!bg[p]&&isStrict(p*4)){bg[p]=1;stack.push(p);}};
   for(let px=0;px<w;px++){seed(px);seed((h-1)*w+px);}
   for(let py=0;py<h;py++){seed(py*w);seed(py*w+w-1);}
   while(stack.length){
     const p=stack.pop(),i=p*4,x0=p%w,y0=(p/w)|0;
     data[i+3]=0;
     const nbs=[];
     if(x0>0)nbs.push(p-1);if(x0<w-1)nbs.push(p+1);if(y0>0)nbs.push(p-w);if(y0<h-1)nbs.push(p+w);
     for(const q of nbs){
       if(bg[q])continue;
       const j=q*4;
       if(isStrict(j)||(lum(j)>150&&chr(j)<26&&dist(i,j)<40&&distRef(j)<50)){bg[q]=1;stack.push(q);}
     }
   }
   /* 邊緣修整：僅移除純中性、幾乎等於背景色且緊鄰去背區的像素 */
   const a2=new Uint8ClampedArray(N);
   for(let p=0;p<N;p++)a2[p]=data[p*4+3];
   for(let p=0;p<N;p++){
     if(bg[p])continue;
     const i=p*4;
     if(!(lum(i)>205&&chr(i)<14&&distRef(i)<26))continue;
     let rim=false;
     const x0=p%w,y0=(p/w)|0;
     for(let dy=-2;dy<=2&&!rim;dy++)for(let dx=-2;dx<=2;dx++){
       const nx=x0+dx,ny=y0+dy;
       if(nx<0||ny<0||nx>=w||ny>=h)continue;
       if(bg[ny*w+nx]){rim=true;break;}
     }
     if(rim)a2[p]=0;
   }
   for(let p=0;p<N;p++)data[p*4+3]=a2[p];
   x.putImageData(d,0,0);
   SPRITE_T[key]=c.toDataURL('image/png');
   document.querySelectorAll('img[data-skey="'+key+'"]').forEach(im=>{im.src=SPRITE_T[key];});
  }catch(e){}res();};
  img.onerror=()=>res();
  img.src=url;
 });
}

const CH_STARTS=[];SCRIPT.forEach((c,i)=>{if(c.t==='chapter')CH_STARTS.push({num:c.num,title:c.title,ptr:i});});
/* ================= engine ================= */
const NAME_COLORS={'劉小姐':'#e8879a','警衛':'#8fa3bf','弟弟':'#7ec98f','母親':'#d98f6a','阿華':'#e0a860','張老師':'#7fb7c9','弟弟（電話）':'#7ec98f','阿華（簡訊）':'#e0a860','新聞頭條':'#ff6b6b'};
const S={ptr:0,typing:false,full:'',shown:0,timer:null,auto:false,skip:false,wait:false,started:false,ended:false};
let chapOpen=false,choiceOpen=false,logOpen=false,autoT=null;
const charLayer=$('charLayer'),bgA=$('bgA'),bgB=$('bgB'),bgWrap=$('bgWrap'),stage=$('stage');
let bgFlip=false;
function setBG(src,tone){
 const show=bgFlip?bgA:bgB,hide=bgFlip?bgB:bgA;bgFlip=!bgFlip;
 show.style.backgroundImage=`url("${src}")`;
 bgWrap.className=tone?('t-'+tone):'';
 show.classList.add('on');hide.classList.remove('on');
}
const slots={};
function crossfadeSprite(cur,animate){
 const holder=cur.el.querySelector('.sprite');
 const key=spriteKey(cur.id,cur.expr,cur.outfit);
 if(cur.key===key&&holder.children.length)return;
 cur.key=key;
 const url=SPRITE_T[key]||CIMG[key];
 const olds=[...holder.children];
 const im=new Image();im.dataset.skey=key;
 im.onload=()=>{
   if(!cur.el.isConnected)return;
   if(!animate||!olds.length){holder.innerHTML='';im.style.opacity='1';holder.appendChild(im);}
   else{
     im.style.opacity='0';holder.appendChild(im);
     requestAnimationFrame(()=>requestAnimationFrame(()=>{im.style.opacity='1';olds.forEach(o=>o.style.opacity='0');}));
     setTimeout(()=>olds.forEach(o=>{if(o.parentNode)o.remove();}),420);
   }
 };
 im.onerror=()=>{holder.innerHTML=svgFallback(cur.id,cur.expr,cur.outfit||'ol');};
 im.src=url;
}
function setChar(c){
 if(c.out){removeCharById(c.id);return;}
 const pos=c.pos||'center';
 let cur=slots[c.id];
 if(!cur){
   const el=document.createElement('div');el.className='char pos-'+pos;
   el.innerHTML='<div class="sprite"></div>';
   charLayer.appendChild(el);
   cur=slots[c.id]={id:c.id,pos,expr:c.expr||'normal',outfit:c.outfit,el,key:null};
   crossfadeSprite(cur,false);
   requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));
   return;
 }
 if(cur.pos!==pos){cur.pos=pos;cur.el.className='char on pos-'+pos;}
 const ne=c.expr||cur.expr,no=(c.outfit!==undefined)?c.outfit:cur.outfit;
 if(ne!==cur.expr||no!==cur.outfit){cur.expr=ne;cur.outfit=no;crossfadeSprite(cur,true);}
}
function removeCharById(id){const cur=slots[id];if(!cur)return;delete slots[id];cur.el.classList.add('out');setTimeout(()=>cur.el.remove(),520);}
function clearChars(){Object.keys(slots).forEach(removeCharById);}
function doFx(id){
 if(id==='flash'){const f=$('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');}
 if(id==='shake'){stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');}
 if(id==='news'){const n=$('newsOv');n.classList.add('on');setTimeout(()=>n.classList.remove('on'),6000);}
 if(id==='tunnel'){const t=$('tunnelFx');t.classList.remove('go');void t.offsetWidth;t.classList.add('go');setTimeout(()=>t.classList.remove('go'),5300);}
}
function showCG(src){const l=$('cgLayer');l.innerHTML='<img src="'+src+'" alt="">';l.classList.add('on');}
function hideCG(){$('cgLayer').classList.remove('on');$('cgLayer').innerHTML='';}
function showChapter(c){
 chapOpen=true;sfx('chime');
 $('chapPill').textContent='第'+c.num+'章　'+c.title;$('chapPill').classList.add('on');
 const cc=$('chapCard');
 cc.innerHTML='<div class="no">第'+c.num+'章</div><div class="ti">'+c.title+'</div><div class="line"></div><div class="hint">點 擊 繼 續</div>';
 cc.classList.add('on');
 const idx=CH_STARTS.findIndex(x=>x.num===c.num);
 try{localStorage.setItem('xinlu_save',JSON.stringify({ptr:S.ptr}));
  const mx=+localStorage.getItem('xinlu_max')||0;if(idx+1>mx)localStorage.setItem('xinlu_max',idx+1);}catch(e){}
}
function showChoice(c){
 choiceOpen=true;const l=$('choiceLayer');
 l.innerHTML='<div class="q">— 你會 —</div>';
 c.options.forEach(op=>{
  const b=document.createElement('button');b.textContent=op.text;
  b.onclick=e=>{e.stopPropagation();choiceOpen=false;l.classList.remove('on');SCRIPT.splice(S.ptr,0,...op.lines);run();};
  l.appendChild(b);
 });
 l.classList.add('on');
}
function typeText(text){
 S.typing=true;S.full=text;S.shown=0;
 $('nextInd').classList.remove('on');
 clearInterval(S.timer);
 S.timer=setInterval(()=>{
  S.shown++;$('textbox').textContent=S.full.slice(0,S.shown);
  if(S.shown>=S.full.length)finishType();
 },28);
}
function finishType(){
 clearInterval(S.timer);S.typing=false;
 $('textbox').textContent=S.full;
 $('nextInd').classList.add('on');
 S.wait=false;
 if(S.skip)autoT=setTimeout(run,110);
 else if(S.auto)autoT=setTimeout(run,1500);
}
function showSay(c){
 S.wait=true;
 const d=$('dialog');d.classList.add('show');
 d.className='show'+(c.cls?(' cls-'+c.cls):'');
 const np=$('nameplate');
 if(c.name){np.classList.remove('hide');np.textContent=c.name;np.style.setProperty('--npc',NAME_COLORS[c.name]||'#ffd9a0');}
 else np.classList.add('hide');
 const lb=$('logBody');const ln=document.createElement('div');ln.className='ln';ln.innerHTML=(c.name?('<b>'+c.name+'</b>'):'')+c.text;lb.appendChild(ln);lb.scrollTop=lb.scrollHeight;
 typeText(c.text);
}
function run(){
 if(S.ended)return;
 clearTimeout(autoT);
 if(S.ptr>=SCRIPT.length)return;
 const c=SCRIPT[S.ptr++];
 switch(c.t){
  case 'bg':setBG(c.src,c.tone);run();break;
  case 'music':AU.play(c.id);run();break;
  case 'sfx':sfx(c.id);run();break;
  case 'pause':S.wait=true;setTimeout(()=>{S.wait=false;run();},S.skip?60:c.ms);break;
  case 'char':setChar(c);run();break;
  case 'clearChars':clearChars();run();break;
  case 'fx':doFx(c.id);run();break;
  case 'cg':showCG(c.src);run();break;
  case 'chapter':showChapter(c);break;
  case 'choice':showChoice(c);break;
  case 'say':showSay(c);break;
  case 'end':showEnd();break;
  default:run();
 }
}
function advance(){
 if(!S.started||S.ended)return;
 if(logOpen){$('logModal').classList.remove('on');logOpen=false;return;}
 if(chapOpen){chapOpen=false;$('chapCard').classList.remove('on');run();return;}
 if(choiceOpen)return;
 if(S.typing){finishType();return;}
 if(S.wait)return;
 run();
}
function showEnd(){
 S.ended=true;$('dialog').classList.remove('show');
 $('endScreen').classList.add('on');AU.play('title');
}
function resetTo(ptr){
 S.ptr=ptr;S.ended=false;S.typing=false;S.wait=false;clearInterval(S.timer);clearTimeout(autoT);
 clearChars();hideCG();$('newsOv').classList.remove('on');$('dialog').classList.remove('show');
 $('endScreen').classList.remove('on');$('chapCard').classList.remove('on');chapOpen=false;choiceOpen=false;
 $('choiceLayer').classList.remove('on');$('logBody').innerHTML='';
 S.started=true;$('titleScreen').style.display='none';$('controls').classList.add('on');
 run();
}
/* ================= UI ================= */
$('game').addEventListener('click',e=>{
 if(e.target.closest('#controls')||e.target.closest('#titleScreen')||e.target.closest('#chapSelect')||e.target.closest('#endScreen')||e.target.closest('#logModal')||e.target.closest('#choiceLayer'))return;
 advance();
});
document.addEventListener('keydown',e=>{
 if(e.code==='Space'||e.code==='Enter'){e.preventDefault();advance();}
 if(e.key==='a'||e.key==='A')toggleAuto();
});
function toggleAuto(){S.auto=!S.auto;$('btnAuto').classList.toggle('act',S.auto);if(S.auto&&!S.typing&&!S.wait){clearTimeout(autoT);autoT=setTimeout(run,600);}}
$('btnAuto').onclick=e=>{e.stopPropagation();toggleAuto();};
$('btnSkip').onclick=e=>{e.stopPropagation();S.skip=!S.skip;$('btnSkip').classList.toggle('act',S.skip);};
$('btnLog').onclick=e=>{e.stopPropagation();logOpen=true;$('logModal').classList.add('on');};
$('logClose').onclick=e=>{e.stopPropagation();logOpen=false;$('logModal').classList.remove('on');};
$('btnMusic').onclick=e=>{e.stopPropagation();AU.muted=!AU.muted;if(AU.master)AU.master.gain.value=AU.muted?0:AU.vol*.9;$('btnMusic').classList.toggle('act',!AU.muted);};
$('vol').oninput=e=>{e.stopPropagation();AU.setVol(e.target.value/100);};
$('vol').onclick=e=>e.stopPropagation();
function startGame(ptr){
 AU.init();if(AU.ctx.resume)AU.ctx.resume();AU.setVol($('vol').value/100);
 $('btnMusic').classList.add('act');
 resetTo(ptr);
}
$('btnStart').onclick=()=>startGame(0);
$('btnCont').onclick=()=>{let p=0;try{p=JSON.parse(localStorage.getItem('xinlu_save')||'{}').ptr||0;}catch(e){}startGame(p);};
$('btnChap').onclick=()=>{
 const l=$('chapList');l.innerHTML='';
 const mx=+localStorage.getItem('xinlu_max')||0;
 CH_STARTS.forEach((ch,i)=>{
  const b=document.createElement('button');b.textContent='第'+ch.num+'章　'+ch.title;
  b.disabled=!(i===0||i<mx);
  b.onclick=()=>{$('chapSelect').classList.remove('on');startGame(ch.ptr);};
  l.appendChild(b);
 });
 $('chapSelect').classList.add('on');
};
$('chapBack').onclick=()=>$('chapSelect').classList.remove('on');
$('btnAgain').onclick=()=>startGame(0);
$('btnTitle2').onclick=()=>{
 S.started=false;S.ended=false;clearChars();hideCG();
 $('endScreen').classList.remove('on');$('controls').classList.remove('on');$('chapPill').classList.remove('on');
 $('titleScreen').style.display='';refreshTitle();AU.play('title');
};
function refreshTitle(){
 let has=false;try{has=!!JSON.parse(localStorage.getItem('xinlu_save')||'null');}catch(e){}
 $('btnCont').disabled=!has;
}
$('titleScreen').querySelector('.bgimg').style.backgroundImage=`url("${BG.title}")`;
refreshTitle();
</script>
